<!DOCTYPE html>
<html lang="vi" data-theme="light">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Caption Library</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:ital,wght@0,400;0,500;0,600;0,700;1,400&family=Fraunces:ital,opsz,wght@0,9..144,500;1,9..144,500;1,9..144,600&display=swap"
    rel="stylesheet" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" />
  <link rel="stylesheet" href="style.css" />
    <link href="./logo.webp" rel="icon" type="image/x-icon" />
</head>

<body>
  <nav class="navbar app-navbar sticky-top py-3">
    <div class="container d-flex justify-content-between align-items-center">
      <span class="app-navbar__brand">📖 Caption Library</span>
      <button id="darkModeToggle" type="button" class="btn-icon" aria-label="Chuyển giao diện sáng/tối">
        <i class="bi bi-moon-stars"></i>
      </button>
    </div>
  </nav>

  <header class="app-tagline">
    <h1>Góc lưu giữ những câu caption hay ho của riêng bạn</h1>
    <p>Sưu tầm, tìm kiếm và copy caption chỉ trong một cú click.</p>
  </header>

  <section class="controls-section">
    <div class="row g-2 align-items-center mb-2">
      <div class="col-12 col-md">
        <div class="input-group search-box">
          <span class="input-group-text"><i class="bi bi-search"></i></span>
          <input type="text" id="searchInput" class="form-control" placeholder="Tìm theo nội dung caption..." />
        </div>
      </div>

      <div class="col-6 col-md-auto d-grid">
        <button id="randomButton" type="button" class="btn btn-outline-secondary">
          <i class="bi bi-dice-5"></i> Random
        </button>
      </div>

      <div class="col-6 col-md-auto d-grid">
        <button id="sortButton" type="button" class="btn btn-outline-secondary" aria-pressed="false">
          <i class="bi bi-sort-alpha-down"></i> Sắp xếp A-Z
        </button>
      </div>
    </div>

    <div id="categoryFilters" class="filter-chip-row"></div>

    <div class="result-bar">
      <span id="resultCount"></span>
    </div>
  </section>

  <main>
    <div id="captionList" class="row row-cols-2 row-cols-md-3 row-cols-lg-4 row-cols-xl-5 g-3"></div>

    <div id="emptyState" class="empty-state d-none">
      <i class="bi bi-emoji-frown"></i>
      <p>Không tìm thấy caption phù hợp.</p>
    </div>
  </main>

  <footer class="app-footer">
    Made with ❤️ by <strong style="color: var(--text2);">QuyCo</strong>
  </footer>

  <button id="backToTop" type="button" class="back-to-top" aria-label="Lên đầu trang">
    <i class="bi bi-arrow-up"></i>
  </button>

  <div class="toast-container position-fixed bottom-0 end-0 p-3">
    <div id="copyToast" class="toast align-items-center text-bg-dark border-0" role="status" aria-live="polite"
      aria-atomic="true">
      <div class="d-flex">
        <div class="toast-body">
          <i class="bi bi-check2-circle"></i> Đã copy caption.
        </div>
        <button type="button" class="btn-close btn-close-white me-2 m-auto" data-bs-dismiss="toast"
          aria-label="Đóng"></button>
      </div>
    </div>
  </div>

  <div class="modal fade" id="captionModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
      <div class="modal-content p-2">
        <div class="modal-header border-0">
          <span id="captionModalCategory" class="badge text-bg-light"></span>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Đóng"></button>
        </div>
        <div class="modal-body">
          <p id="captionModalContent" class="caption-card__content caption-card__content--modal"></p>
        </div>
        <div class="modal-footer border-0">
          <button id="captionModalCopyBtn" type="button" class="btn btn-copy" data-action="copy">
            <i class="bi bi-clipboard"></i> Copy caption này
          </button>
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/data.js"></script>
  <script src="js/render.js"></script>
  <script src="js/app.js"></script>
</body>

</html>
